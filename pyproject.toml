[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "folderfind"
version = "1.0.0"
description = "Fuzzy folder finder for the terminal: pick a directory from the closest matches and cd into it."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["cd", "fuzzy", "finder", "terminal", "shell", "navigation"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Shells",
]

[project.scripts]
ff = "ff:main"

[tool.setuptools]
py-modules = ["ff"]
